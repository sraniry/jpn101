pages:
  stage: deploy
  script:
    - mkdir -p public
    - cp index.html styles.css manifest.json sw.js public/
    - cp icon-192.png icon-512.png icon.svg public/ 2>/dev/null || true
    - cp -r src public/
    - cp -r data public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
